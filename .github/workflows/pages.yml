---
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

name: Publish Documentation

# No ref in the group: every run pushes to the same pages branch, so
# they have to be serialized regardless of what they were started from.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # rst2html5 comes from python3-docutils, the same package the CI
      # docs job installs.
      - run: |
          sudo apt-get -qq -y update
          sudo apt-get -qq -y install python3-docutils

      - run: make -C doc html

      - name: checkout the pages branch
        uses: actions/checkout@v4
        with:
          ref: pages
          path: pages

      - name: update the pages branch
        run: |
          set -x
          # A tag push names the release.  A manual run can start from
          # any ref, so name the branch and the commit it published.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="${GITHUB_REF_NAME} $(git rev-parse --short HEAD)"
          fi
          # Remove the previous release's files so documentation that
          # no longer exists does not stay published.
          find pages -mindepth 1 -maxdepth 1 ! -name .git \
                  -exec rm -rf {} +
          cp -pr doc/html/. pages/
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email \
                  "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "documentation unchanged"
            exit 0
          fi
          git commit -m "Update with ${version} docs"
          git push
